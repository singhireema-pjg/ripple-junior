<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ripple Effect — Gamma Interactive Quiz</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f2f2ec;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:18px}
#quiz{width:min(1100px,100%)}
.stage{position:relative;width:100%;aspect-ratio:1473/826;overflow:hidden;background:#f4f5e9}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.hotspot{position:absolute;border:2px solid transparent;border-radius:10px;background:transparent;cursor:pointer;transition:.15s}
.hotspot:hover{background:rgba(255,255,255,.16);border-color:rgba(26,64,43,.35)}
.hotspot.selected{background:rgba(35,130,75,.15);border-color:#25824a;box-shadow:0 0 0 3px rgba(37,130,74,.15)}
.hotspot input{position:absolute;opacity:0;pointer-events:none}
.ui{position:absolute;left:3%;right:3%;bottom:3%;display:flex;justify-content:flex-end;gap:10px;z-index:20;pointer-events:none}
.btn{pointer-events:auto;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;background:#173f2b;color:white;box-shadow:0 3px 8px #0003}
.btn.light{background:#fff;color:#173f2b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{position:absolute;top:3%;right:3%;z-index:20;background:#fff;color:#173f2b;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px #0002}
.result{background:#f4f5e9;border-radius:18px;padding:40px;text-align:center;color:#173f2b}
.result h1{font-size:38px;margin:0 0 12px}
.result .score{font-size:58px;font-weight:800;margin:12px 0}
.result p{font-size:19px;line-height:1.5}
.feedback-panel{position:absolute;left:3%;bottom:3%;max-width:58%;z-index:30;background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 3px 12px #0004;color:#173f2b;font-size:15px;line-height:1.35}
.feedback-panel strong{display:block;margin-bottom:3px}
@media(max-width:650px){body{padding:6px}.btn{font-size:12px;padding:8px 12px}.badge{font-size:11px;padding:5px 9px}.feedback-panel{font-size:12px;max-width:70%}}
</style>
</head>

const questions = [
  {id:1,slide:3,answer:[3],type:"single",feedback:"Spending too long on one choice can leave less time for the important work."},
  {id:2,slide:5,answer:[0,2,3],type:"multi",feedback:"Waiting can create pressure, rushing, and fewer chances to improve the model."},
  {id:3,slide:7,answer:[1],type:"single",feedback:"Testing more than once helps us learn whether something works reliably."},
  {id:4,slide:9,answer:[0],type:"single",feedback:"Small choices can create a ripple effect, leading to bigger changes later."}
];
const hotspots = {"3": [[3.6, 46.8, 27.0, 20.2], [31.7, 46.8, 27.0, 20.2], [3.6, 68.9, 27.0, 24.8], [31.7, 68.9, 27.0, 24.8]], "5": [[3.6, 43.0, 27.0, 16.2], [31.7, 43.0, 27.0, 16.2], [3.6, 61.0, 27.0, 16.2], [31.7, 61.0, 27.0, 16.2]], "7": [[3.6, 43.0, 27.0, 16.2], [31.7, 43.0, 27.0, 16.2], [3.6, 61.0, 27.0, 16.2], [31.7, 61.0, 27.0, 16.2]], "9": [[35.1, 60.8, 28.3, 14.0], [65.9, 60.8, 28.3, 14.0]]};
const answerSlides = {"3": 4, "5": 6, "7": 8, "9": 10};
let screen="intro", qi=0, selected=[], score=0;

function stage(image, inner="") {
  return `<div class="stage"><img src="${slides[image]}" alt="">${inner}</div>`;
}
function render() {
  const root=document.getElementById("quiz");
  if(screen==="intro") {
    root.innerHTML=stage(1, `<div class="ui"><button class="btn" id="start">Start Quiz</button></div>`);
    document.getElementById("start").onclick=()=>{screen="how";render()};
    return;
  }
  if(screen==="how") {
    root.innerHTML=stage(2, `<div class="ui"><button class="btn" id="begin">Begin Questions</button></div>`);
    document.getElementById("begin").onclick=()=>{screen="question";qi=0;score=0;selected=[];render()};
    return;
  }
  if(screen==="result") {
    const pct=Math.round(score/questions.length*100);
    let msg=pct===100?"Excellent! You spotted the ripple effects carefully.":pct>=75?"Great thinking! You looked beyond the first result.":pct>=50?"Good start! Keep asking, “What could happen next?”":"Keep practising: think about the next change before choosing an answer.";
    root.innerHTML=`<div class="result"><h1>THE RIPPLE EFFECT</h1><div>JUNIOR THINKERS QUIZ COMPLETE</div><div class="score">${score} / ${questions.length}</div><p><strong>${pct}%</strong></p><p>${msg}</p><p><strong>Remember:</strong><br>Choice → Next change → Bigger result</p><button class="btn" id="again">Try Again</button></div>`;
    document.getElementById("again").onclick=()=>{screen="intro";render()};
    return;
  }
  if(screen==="answer") {
    const q=questions[qi];
    const correct=selected.length===q.answer.length && selected.every(x=>q.answer.includes(x));
    const aSlide=answerSlides[q.slide];
    root.innerHTML=stage(aSlide, `<div class="feedback-panel"><strong>${correct?"Great thinking!":"Let’s learn from it."}</strong>${escapeHtml(q.feedback)}</div><div class="ui"><button class="btn" id="next">${qi===questions.length-1?"See My Result":"Next Question"}</button></div>`);
    document.getElementById("next").onclick=()=>{if(qi<questions.length-1){qi++;selected=[];screen="question";render()}else{screen="result";render()}};
    return;
  }
  const q=questions[qi];
  const hs=hotspots[String(q.slide)];
  let overlay="";
  hs.forEach((b,i)=>{
    overlay+=`<button type="button" class="hotspot ${selected.includes(i)?"selected":""}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" data-i="${i}" aria-label="Answer ${i+1}"></button>`;
  });
  root.innerHTML=stage(q.slide, `<div class="badge">QUESTION ${q.id} OF ${questions.length}</div>${overlay}<div class="ui"><button class="btn" id="check">Check Answer</button></div>`);
  document.querySelectorAll(".hotspot").forEach(el=>el.onclick=()=>{
    const i=Number(el.dataset.i);
    if(q.type==="multi") {
      selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];
    } else {
      selected=[i];
    }
    render();
  });
  document.getElementById("check").onclick=()=>{
    if(!selected.length) return;
    const correct=selected.length===q.answer.length && selected.every(x=>q.answer.includes(x));
    if(correct) score++;
    screen="answer";render();
  };
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
render();
</script>
